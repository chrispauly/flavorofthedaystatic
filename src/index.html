<html lang="en">

<head>
	<title>Flavor of the Day</title>
	<style type="text/css">
		body {
			font-family: Roboto, sans-serif;
		}

		.flavor {
			text-align: center;
		}

		#fetchtime {
			font-style: italic;
			font-size: .6em;
		}
	</style>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<h1>Flavor of the Day near
		<div id='headingzip'>your current location</div>
	</h1>
	<div id="fetchtime"></div>
	<table id="table"></table>

	<script>

		function closedMessage(closingTime) {
			const parsedTime = /^(?<HR>\d{1,2}):(?<MIN>\d{1,2}) (?<AMPM>AM|PM)$/.exec(closingTime);

			if (parsedTime) {
				const now = new Date();
				const nowTime = String(now.getHours()).padStart(2, '0') + ':' + now.getMinutes();

				var iCloseHour = parseInt(parsedTime.groups['HR']);
				if (parsedTime.groups['AMPM'] === 'PM') iCloseHour += 12;
				const closeTime = String(iCloseHour).padStart(2, '0') + ':' + parsedTime.groups['MIN'];

				if (nowTime > closeTime) return 'Closed today at ' + closingTime;

				return 'Closes today at ' + closingTime;
			}
			return '';
		}

		async function getLocationDataFromCoords(lat, lon) {
			try {
				const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
				const data = await response.json();
				const address = data.address || {};
				return {
					city: address.city || address.town || address.village || 'Unknown location',
					postalCode: address.postcode || ''
				};
			} catch (e) {
				return {
					city: 'your current location',
					postalCode: ''
				};
			}
		}

		function removeWaitCursor() {
			document.body.style.cursor = 'default';
		}

		// Return milliseconds until next 6am
		function nextRunTime() {
			var now = new Date();
			var isEarly = (now.getHours() < 6);
			var next6am = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (isEarly ? 0 : 1), 6);
			return next6am.getTime() - Date.now();
		}

		function setCookie(name, value, days = 365) {
			const date = new Date();
			date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
			document.cookie = `${name}=${encodeURIComponent(value)};expires=${date.toUTCString()};path=/;SameSite=Lax`;
		}

		function getCookie(name) {
			const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
			return match ? decodeURIComponent(match[2]) : null;
		}

		async function fotdFetch(locationQuery) {
			document.body.style.cursor = 'wait';
			document.querySelector('#table').innerHTML = '<tr><td colspan="2">Loading flavors...</td></tr>';
			const dayOfWeekName = new Date().toLocaleString('default', { weekday: 'long' });
			const fetchUrl = 'https://www.culvers.com/api/locator/getLocations?location=' + encodeURIComponent(locationQuery) + '&radius=40233&limit=10';
			const newFetchUrl = 'https://corsproxy.io/?' + encodeURIComponent(fetchUrl);

			try {
				const response = await fetch(newFetchUrl);
				const json = await response.json();
				document.querySelector('#fetchtime').innerHTML = "Last updated: " + (new Date()).toLocaleString();
				let fl = '';
				json.data.geofences.forEach(function (loc) {
					if (!loc.metadata.flavorOfDayName || loc.metadata.flavorOfDayName === '') {
						console.log('No FotD so skipping location: ' + JSON.stringify(loc));
					}
					else {
						let addr = loc.metadata.street + ' ' + loc.metadata.city + ', ' + loc.metadata.state;
						fl += '<tr>';
						fl += '<td>';
						fl += loc.description;
						fl += '<br /> ' + closedMessage(JSON.parse(loc.metadata.driveThruHours)[dayOfWeekName.substring(0, 2) + 'C']);
						fl += '<br /><a href="https://www.google.com/maps/dir//' + addr + '">' + addr + '</a>';
						fl += '</td>';
						fl += '<td class="flavor"><a href="https://www.culvers.com/restaurants/' + loc.metadata.slug + '#view-calendar" title="Click to see future flavors"><img src="https://cdn.culvers.com/menu-item-detail/' + loc.metadata.flavorOfDaySlug + '" width="177"><br />' + loc.metadata.flavorOfDayName + '</a></td>';
						fl += '</tr>';
					}
				});
				document.querySelector('#table').innerHTML = fl || '<tr><td colspan="2">No flavors found for this area.</td></tr>';
				removeWaitCursor();
			} catch (e) {
				document.querySelector('#table').innerHTML = '<tr><td colspan="2">Error loading flavors. Please try again later.</td></tr>';
				removeWaitCursor();
			}

			setTimeout(function () { window.location.reload(); }, nextRunTime());
		}

		async function init() {
			const saved = getCookie('fotdLastLocation');
			let initialQuery, initialCity;

			if (saved) {
				[initialQuery, initialCity] = saved.split('|');
				document.querySelector('#headingzip').innerHTML = initialCity || 'your last location';
				document.querySelector('#fetchtime').innerHTML = 'Using last known location...';
				await fotdFetch(initialQuery);
			} else {
				document.querySelector('#headingzip').innerHTML = 'locating...';
			}

			if (navigator.geolocation) {
				navigator.geolocation.getCurrentPosition(async (position) => {
					const lat = position.coords.latitude;
					const lon = position.coords.longitude;
					const locationData = await getLocationDataFromCoords(lat, lon);
					const query = locationData.postalCode || `${lat},${lon}`;
					setCookie('fotdLastLocation', `${query}|${locationData.city}`);

					if (!saved || initialQuery !== query) {
						document.querySelector('#headingzip').innerHTML = locationData.city;
						await fotdFetch(query);
					}
				}, () => {
					removeWaitCursor();
					if (!saved) {
						document.querySelector('#table').innerHTML = '<tr><td colspan="2">Location access denied. Please enable location.</td></tr>';
					}
				});
			} else {
				if (!saved) {
					document.querySelector('#table').innerHTML = '<tr><td colspan="2">Geolocation not supported.</td></tr>';
				}
			}
		}

		init();
	</script>

</body>

</html>
